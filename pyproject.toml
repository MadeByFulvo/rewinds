[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rewinds"
version = "0.1.0"
description = "Run any file from any commit, without touching your working tree."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MadeByFulvo" }]
keywords = ["git", "bisect", "cli", "developer-tools", "history"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
rewinds = "rewinds.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["rewinds"]
